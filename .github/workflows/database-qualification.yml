name: Isolated database qualification

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - b30-staging-acceptance-20261024
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/sql/**'
      - 'tests/notification-filtered-permission.cjs'
      - 'tests/verified-account-008-static.cjs'
      - '.github/workflows/database-qualification.yml'

jobs:
  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Verify SQL CLI syntax (2.120.0)
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase db --help
          supabase db query --help | tee "$RUNNER_TEMP/db-query-help.txt"
          grep -q -- '--local' "$RUNNER_TEMP/db-query-help.txt"
          grep -q -- '--file' "$RUNNER_TEMP/db-query-help.txt"

      - name: Prepare isolated pre-008 workspace
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/supabase-baseline"
          echo "BASELINE_DIR=$baseline" >> "$GITHUB_ENV"
          python - "$baseline" <<'PY'
          from pathlib import Path
          import os
          import shutil
          import sys

          root = Path.cwd()
          baseline = Path(sys.argv[1])
          migrations_dir = baseline / "supabase" / "migrations"
          migrations_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(root / "supabase" / "config.toml", baseline / "supabase" / "config.toml")
          seed = root / "supabase" / "seed.sql"
          if seed.exists():
              shutil.copy2(seed, baseline / "supabase" / "seed.sql")
          migrations = sorted((root / "supabase" / "migrations").glob("*.sql"))
          selected = [p for p in migrations if p.name < "202610260008"]
          if not selected:
              raise SystemExit("no pre-008 migrations found")
          for source in selected:
              shutil.copy2(source, migrations_dir / source.name)
          actual = sorted(p.name for p in migrations_dir.glob("*.sql"))
          unexpected = [name for name in actual if name >= "202610260008"]
          if unexpected:
              raise SystemExit(f"pre-008 workspace contains post-007 migrations: {unexpected}")
          Path(os.environ["RUNNER_TEMP"], "pre-008-migrations.txt").write_text("\n".join(actual) + "\n")
          print("\n".join(actual))
          PY
          {
            echo '### Pre-008 workspace migration manifest'
            echo '```text'
            cat "$RUNNER_TEMP/pre-008-migrations.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start isolated pre-008 database
        id: start-baseline
        shell: bash
        working-directory: ${{ env.BASELINE_DIR }}
        run: |
          set +e
          supabase db start > "$RUNNER_TEMP/pre-008-start.raw.log" 2>&1
          rc=$?
          sed -E 's/((PASSWORD|TOKEN|SECRET|API[_-]?KEY|JWT|SERVICE_ROLE)[=:][^[:space:]]+)/\2=[REDACTED]/Ig' "$RUNNER_TEMP/pre-008-start.raw.log" | tee "$RUNNER_TEMP/pre-008-start.log"
          echo "start_exit_code=$rc" >> "$RUNNER_TEMP/pre-008-start.log"
          exit "$rc"

      - name: Read real pre-008 catalog baseline
        if: steps.start-baseline.outcome == 'success'
        shell: bash
        working-directory: ${{ env.BASELINE_DIR }}
        run: |
          set -euo pipefail
          supabase db query --local -f "$GITHUB_WORKSPACE/tests/sql/verified-account-008-baseline.sql" \
            | tee "$RUNNER_TEMP/verified-account-008-baseline.txt"
          {
            echo '### Real catalog baseline before 008'
            echo '```text'
            sed -E 's/((PASSWORD|TOKEN|SECRET|API[_-]?KEY|JWT|SERVICE_ROLE)[=:][^[:space:]]+)/\2=[REDACTED]/Ig' "$RUNNER_TEMP/verified-account-008-baseline.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop pre-008 database
        if: always()
        shell: bash
        working-directory: ${{ env.BASELINE_DIR }}
        run: supabase stop --no-backup || true

      - name: Prepare B31 allowlisted migration workspace
        if: steps.start-baseline.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          full="$RUNNER_TEMP/supabase-b31"
          echo "FULL_DIR=$full" >> "$GITHUB_ENV"
          python - "$full" <<'PY'
          from pathlib import Path
          import os, shutil, sys
          root = Path.cwd()
          full = Path(sys.argv[1])
          migrations_dir = full / 'supabase' / 'migrations'
          migrations_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(root / 'supabase' / 'config.toml', full / 'supabase' / 'config.toml')
          seed = root / 'supabase' / 'seed.sql'
          if seed.exists(): shutil.copy2(seed, full / 'supabase' / 'seed.sql')
          all_files = sorted((root / 'supabase' / 'migrations').glob('*.sql'))
          selected = [p for p in all_files if p.name < '202610260011_resale_verified_offer_order_permissions.sql'
                      or p.name == '202611060001_b31_buyer_receipt_protection.sql']
          if any(p.name == '202610260011_resale_verified_offer_order_permissions.sql' for p in selected):
              raise SystemExit('Migration 011 entered the B31 allowlist')
          if not any(p.name == '202611060001_b31_buyer_receipt_protection.sql' for p in selected):
              raise SystemExit('B31 migration is missing from the allowlist')
          for source in selected: shutil.copy2(source, migrations_dir / source.name)
          actual = sorted(p.name for p in migrations_dir.glob('*.sql'))
          Path(os.environ['RUNNER_TEMP'], 'b31-migrations.txt').write_text('\n'.join(actual) + '\n')
          print('\n'.join(actual))
          PY
          {
            echo '### B31 allowlisted migration manifest'
            echo '```text'
            cat "$RUNNER_TEMP/b31-migrations.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start full disposable Supabase database
        id: start-full
        if: steps.start-baseline.outcome == 'success'
        working-directory: ${{ env.FULL_DIR }}
        shell: bash
        run: |
          set +e
          {
            echo '=== supabase version ==='
            supabase --version
            echo '=== docker version ==='
            docker version
            echo '=== full start command ==='
            supabase db start
          } > supabase-start.raw.log 2>&1
          rc=$?
          sed -E 's/((PASSWORD|TOKEN|SECRET|API[_-]?KEY|JWT|SERVICE_ROLE)[=:][^[:space:]]+)/\2=[REDACTED]/Ig' supabase-start.raw.log | tee supabase-start.log
          rm -f supabase-start.raw.log
          echo "start_exit_code=$rc" >> supabase-start.log
          exit "$rc"

      - name: Apply the complete migration chain
        if: steps.start-full.outcome == 'success'
        working-directory: ${{ env.FULL_DIR }}
        run: supabase db reset --local

      - name: Verify B31 migration allowlist and protection catalog
        if: steps.start-full.outcome == 'success'
        working-directory: ${{ env.FULL_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "supabase/migrations/202610260011_resale_verified_offer_order_permissions.sql"
          test -e "supabase/migrations/202611060001_b31_buyer_receipt_protection.sql"
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          begin read only;
          do $$
          begin
            if (select count(*) from supabase_migrations.schema_migrations where version='202611060001') <> 1 then raise exception 'B31 migration missing or duplicated'; end if;
            if exists(select 1 from supabase_migrations.schema_migrations where version='202610260011') then raise exception 'Migration 011 was executed'; end if;
            if not exists(select 1 from information_schema.columns where table_schema='marketplace_private' and table_name='order_protection' and column_name='release_eligible_at') then raise exception 'release gate column missing'; end if;
            if not exists(select 1 from pg_trigger where tgname='order_transfer_b31_release_gate') then raise exception 'transfer release gate missing'; end if;
          end $$;
          rollback;
          SQL
          node "$GITHUB_WORKSPACE/tests/b31-protection-static.cjs"
      - name: Run B31 protection database assertions
        if: steps.start-full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/sql/b31-protection-assertions.sql
      - name: Run B31 runtime protection lifecycle assertions
        if: steps.start-full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          cat tests/delivery-area-economics-staging.sql tests/sql/b31-runtime-assertions.sql \
            | docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres
      - name: Verify filtered notification definition and privileges
        if: steps.start-full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Multi-statement assertions require one session for transaction and SET ROLE.
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/sql/notification-filtered-assertions.sql
      - name: Run 008/009 authenticated and cross-account SQL assertions
        if: steps.start-full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Multi-statement assertions require one session for transaction and SET ROLE.
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/sql/permissions-008-009-assertions.sql
      - name: Run static migration omission regression
        if: steps.start-full.outcome == 'success'
        run: node tests/notification-filtered-permission.cjs
      - name: Run verified-account 008 static manifest regression
        if: steps.start-full.outcome == 'success'
        run: node tests/verified-account-008-static.cjs

      - name: Diagnose failed database startup
        if: failure() && (steps.start-baseline.outcome == 'failure' || steps.start-full.outcome == 'failure')
        shell: bash
        run: |
          set +e
          {
            echo '=== docker containers ==='
            docker ps -a --no-trunc --filter name=supabase
            for id in $(docker ps -aq --filter name=supabase); do
              docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$id"
              docker logs --tail 80 "$id" 2>&1 | sed -E 's/((PASSWORD|TOKEN|SECRET|API[_-]?KEY|JWT|SERVICE_ROLE)[=:][^[:space:]]+)/\2=[REDACTED]/Ig'
            done
          } | tee "$RUNNER_TEMP/supabase-start-diagnostics.log"

      - name: Upload database diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-qualification-diagnostics
          path: |
            ${{ runner.temp }}/pre-008-migrations.txt
            ${{ runner.temp }}/b31-migrations.txt
            ${{ runner.temp }}/pre-008-start.log
            ${{ runner.temp }}/verified-account-008-baseline.txt
            ${{ runner.temp }}/supabase-start-diagnostics.log
            supabase-start.log
          retention-days: 1

      - name: Stop and destroy the full database
        if: always() && env.FULL_DIR != ''
        working-directory: ${{ env.FULL_DIR }}
        run: supabase stop --no-backup || true
