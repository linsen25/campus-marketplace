name: Isolated database qualification

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - b30-staging-acceptance-20261024
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/sql/**'
      - 'tests/notification-filtered-permission.cjs'
      - 'tests/verified-account-008-static.cjs'
      - '.github/workflows/database-qualification.yml'

jobs:
  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Verify SQL CLI syntax (2.120.0)
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase db --help
          supabase db query --help | tee "$RUNNER_TEMP/db-query-help.txt"
          grep -q -- '--local' "$RUNNER_TEMP/db-query-help.txt"
          grep -q -- '--file' "$RUNNER_TEMP/db-query-help.txt"

      - name: Prepare isolated pre-008 workspace
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/supabase-baseline"
          echo "BASELINE_DIR=$baseline" >> "$GITHUB_ENV"
          python - "$baseline" <<'PY'
          from pathlib import Path
          import os
          import shutil
          import sys

          root = Path.cwd()
          baseline = Path(sys.argv[1])
          migrations_dir = baseline / "supabase" / "migrations"
          migrations_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(root / "supabase" / "config.toml", baseline / "supabase" / "config.toml")
          seed = root / "supabase" / "seed.sql"
          if seed.exists():
              shutil.copy2(seed, baseline / "supabase" / "seed.sql")
          migrations = sorted((root / "supabase" / "migrations").glob("*.sql"))
          selected = [p for p in migrations if p.name < "202610260008"]
          if not selected:
              raise SystemExit("no pre-008 migrations found")
          for source in selected:
              shutil.copy2(source, migrations_dir / source.name)
          actual = sorted(p.name for p in migrations_dir.glob("*.sql"))
          unexpected = [name for name in actual if name >= "202610260008"]
          if unexpected:
              raise SystemExit(f"pre-008 workspace contains post-007 migrations: {unexpected}")
          Path(os.environ["RUNNER_TEMP"], "pre-008-migrations.txt").write_text("\n".join(actual) + "\n")
          print("\n".join(actual))
          PY
          {
            echo '### Pre-008 workspace migration manifest'
            echo '```text'
            cat "$RUNNER_TEMP/pre-008-migrations.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start isolated pre-008 database
        id: start-baseline
        shell: bash
        working-directory: ${{ env.BASELINE_DIR }}
        run: |
          set +e
          supabase db start > "$RUNNER_TEMP/pre-008-start.raw.log" 2>&1
          rc=$?
          sed -E 's/((PASSWORD|TOKEN|SECRET|API[_-]?KEY|JWT|SERVICE_ROLE)[=:][^[:space:]]+)/\2=[REDACTED]/Ig' "$RUNNER_TEMP/pre-008-start.raw.log" | tee "$RUNNER_TEMP/pre-008-start.log"
          echo "start_exit_code=$rc" >> "$RUNNER_TEMP/pre-008-start.log"
          exit "$rc"

      - name: Read real pre-008 catalog baseline
        if: steps.start-baseline.outcome == 'success'
        shell: bash
        working-directory: ${{ env.BASELINE_DIR }}
        run: |
          set -euo pipefail
          supabase db query --local -f "$GITHUB_WORKSPACE/tests/sql/verified-account-008-baseline.sql" \
            | tee "$RUNNER_TEMP/verified-account-008-baseline.txt"
          {
            echo '### Real catalog baseline before 008'
            echo '```text'
            sed -E 's/((PASSWORD|TOKEN|SECRET|API[_-]?KEY|JWT|SERVICE_ROLE)[=:][^[:space:]]+)/\2=[REDACTED]/Ig' "$RUNNER_TEMP/verified-account-008-baseline.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop pre-008 database
        if: always()
        shell: bash
        working-directory: ${{ env.BASELINE_DIR }}
        run: supabase stop --no-backup || true

      - name: Prepare B31 allowlisted migration workspace
        if: steps.start-baseline.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          full="$RUNNER_TEMP/supabase-b31"
          echo "FULL_DIR=$full" >> "$GITHUB_ENV"
          python - "$full" <<'PY'
          from pathlib import Path
          import os, shutil, sys
          root = Path.cwd()
          full = Path(sys.argv[1])
          migrations_dir = full / 'supabase' / 'migrations'
          migrations_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(root / 'supabase' / 'config.toml', full / 'supabase' / 'config.toml')
          seed = root / 'supabase' / 'seed.sql'
          if seed.exists(): shutil.copy2(seed, full / 'supabase' / 'seed.sql')
          all_files = sorted((root / 'supabase' / 'migrations').glob('*.sql'))
          selected = [p for p in all_files if p.name < '202610260011_resale_verified_offer_order_permissions.sql'
                      or p.name == '202611060001_b31_buyer_receipt_protection.sql']
          if any(p.name == '202610260011_resale_verified_offer_order_permissions.sql' for p in selected):
              raise SystemExit('Migration 011 entered the B31 allowlist')
          if not any(p.name == '202611060001_b31_buyer_receipt_protection.sql' for p in selected):
              raise SystemExit('B31 migration is missing from the allowlist')
          for source in selected: shutil.copy2(source, migrations_dir / source.name)
          actual = sorted(p.name for p in migrations_dir.glob('*.sql'))
          Path(os.environ['RUNNER_TEMP'], 'b31-migrations.txt').write_text('\n'.join(actual) + '\n')
          print('\n'.join(actual))
          PY
          {
            echo '### B31 allowlisted migration manifest'
            echo '```text'
            cat "$RUNNER_TEMP/b31-migrations.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start full disposable Supabase database
        id: start-full
        if: steps.start-baseline.outcome == 'success'
        working-directory: ${{ env.FULL_DIR }}
        shell: bash
        run: |
          set +e
          {
            echo '=== supabase version ==='
            supabase --version
            echo '=== docker version ==='
            docker version
            echo '=== full start command ==='
            supabase db start
          } > supabase-start.raw.log 2>&1
          rc=$?
          sed -E 's/((PASSWORD|TOKEN|SECRET|API[_-]?KEY|JWT|SERVICE_ROLE)[=:][^[:space:]]+)/\2=[REDACTED]/Ig' supabase-start.raw.log | tee supabase-start.log
          rm -f supabase-start.raw.log
          echo "start_exit_code=$rc" >> supabase-start.log
          exit "$rc"

      - name: Apply the complete migration chain
        if: steps.start-full.outcome == 'success'
        working-directory: ${{ env.FULL_DIR }}
        run: supabase db reset --local

      - name: Verify B31 migration allowlist and protection catalog
        if: steps.start-full.outcome == 'success'
        working-directory: ${{ env.FULL_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "supabase/migrations/202610260011_resale_verified_offer_order_permissions.sql"
          test -e "supabase/migrations/202611060001_b31_buyer_receipt_protection.sql"
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          begin read only;
          do $$
          begin
            if (select count(*) from supabase_migrations.schema_migrations where version='202611060001') <> 1 then raise exception 'B31 migration missing or duplicated'; end if;
            if exists(select 1 from supabase_migrations.schema_migrations where version='202610260011') then raise exception 'Migration 011 was executed'; end if;
            if not exists(select 1 from information_schema.columns where table_schema='marketplace_private' and table_name='order_protection' and column_name='release_eligible_at') then raise exception 'release gate column missing'; end if;
            if not exists(select 1 from pg_trigger where tgname='order_transfer_b31_release_gate') then raise exception 'transfer release gate missing'; end if;
          end $$;
          rollback;
          SQL
          node "$GITHUB_WORKSPACE/tests/b31-protection-static.cjs"
      - name: Run B31 protection database assertions
        if: steps.start-full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/sql/b31-protection-assertions.sql
      - name: Run B31 runtime protection lifecycle assertions
        if: steps.start-full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          {
            sed -n '1,35p' tests/delivery-area-economics-staging.sql
            cat tests/sql/b31-runtime-seed.sql
            sed -n '36,$p' tests/delivery-area-economics-staging.sql
            cat tests/sql/b31-runtime-assertions.sql
          } | docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres

      - name: Run B31 independent-session concurrency assertions
        if: steps.start-full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          {
            sed -n '1,35p' tests/delivery-area-economics-staging.sql
            cat tests/sql/b31-runtime-seed.sql
            sed -n '36,$p' tests/delivery-area-economics-staging.sql
            cat tests/sql/b31-concurrency-setup.sql
          } | docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres

          read -r receipt_order receipt_listing receipt_buyer receipt_seller receipt_cmd < <(
            docker exec -i "$db_container" psql -X -At -F ' ' -U postgres -d postgres \
              -c "select order_id,listing_id,buyer_id,seller_id,command_id from public.b31_concurrency_fixture where name='receipt';"
          )
          read -r settle_order settle_listing settle_buyer settle_seller settle_cmd < <(
            docker exec -i "$db_container" psql -X -At -F ' ' -U postgres -d postgres \
              -c "select order_id,listing_id,buyer_id,seller_id,command_id from public.b31_concurrency_fixture where name='settlement';"
          )
          read -r case_order case_listing case_buyer case_seller case_cmd < <(
            docker exec -i "$db_container" psql -X -At -F ' ' -U postgres -d postgres \
              -c "select order_id,listing_id,buyer_id,seller_id,command_id from public.b31_concurrency_fixture where name='case';"
          )
          read -r refund_order refund_listing refund_buyer refund_seller refund_cmd < <(
            docker exec -i "$db_container" psql -X -At -F ' ' -U postgres -d postgres \
              -c "select order_id,listing_id,buyer_id,seller_id,command_id from public.b31_concurrency_fixture where name='refund';"
          )
          test -n "$receipt_order" -a -n "$settle_order" -a -n "$case_order" -a -n "$refund_order" || { echo 'Concurrency fixtures missing' >&2; exit 1; }

          cat > "$RUNNER_TEMP/b31-receipt-a.sql" <<SQL
          begin;
          set local application_name='b31_receipt_a';
          set local request.jwt.claims='{"sub":"$receipt_buyer","role":"authenticated"}';
          select pg_advisory_xact_lock(hashtextextended('$receipt_buyer'::text||'courier_received'||'$receipt_cmd'::text,0));
          select pg_sleep(2);
          select public.marketplace_confirm_buyer_receipt('$receipt_order'::uuid,'$receipt_cmd'::uuid);
          commit;
          SQL
          cat > "$RUNNER_TEMP/b31-receipt-b.sql" <<SQL
          begin;
          set local application_name='b31_receipt_b';
          set local request.jwt.claims='{"sub":"$receipt_buyer","role":"authenticated"}';
          select public.marketplace_confirm_buyer_receipt('$receipt_order'::uuid,'$receipt_cmd'::uuid);
          commit;
          SQL
          set +e
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/b31-receipt-a.sql" > "$RUNNER_TEMP/b31-receipt-a.log" 2>&1 & pid_a=$!
          sleep 0.3
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/b31-receipt-b.sql" > "$RUNNER_TEMP/b31-receipt-b.log" 2>&1 & pid_b=$!
          wait "$pid_a"; rc_a=$?
          wait "$pid_b"; rc_b=$?
          set -e
          cat "$RUNNER_TEMP/b31-receipt-a.log" "$RUNNER_TEMP/b31-receipt-b.log"
          test "$rc_a" -eq 0 -a "$rc_b" -eq 0 || { echo 'Buyer Receipt concurrent sessions failed' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<SQL
          do \$\$
          declare n integer; t timestamptz; begin
            select count(*),max(confirmed_at) into n,t from marketplace_private.buyer_receipt_commands where order_id='$receipt_order'::uuid;
            if n<>1 or t is null then raise exception 'Buyer Receipt concurrency invariant failed'; end if;
            if (select count(*) from public.transaction_events where order_id='$receipt_order'::uuid and event_type='buyer_confirm_received')<>1 then raise exception 'Duplicate Buyer Receipt event'; end if;
          end \$\$;
          SQL
          echo 'PASS B31 Buyer Receipt independent-session idempotency'

          # Two independent workers claim the same mature order through the
          # real due-work entry point. The database gate must complete it once.
          cat > "$RUNNER_TEMP/b31-due-a.sql" <<SQL
          begin;
          set local application_name='b31_due_a';
          set local request.jwt.claims='{"role":"service_role","ref":"pcaqxezdfxofysghssyo"}';
          select marketplace_private.run_transaction_due_work();
          commit;
          SQL
          cat > "$RUNNER_TEMP/b31-due-b.sql" <<SQL
          begin;
          set local application_name='b31_due_b';
          set local request.jwt.claims='{"role":"service_role","ref":"pcaqxezdfxofysghssyo"}';
          select marketplace_private.run_transaction_due_work();
          commit;
          SQL
          set +e
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/b31-due-a.sql" > "$RUNNER_TEMP/b31-due-a.log" 2>&1 & pid_a=$!
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/b31-due-b.sql" > "$RUNNER_TEMP/b31-due-b.log" 2>&1 & pid_b=$!
          wait "$pid_a"; rc_a=$?
          wait "$pid_b"; rc_b=$?
          set -e
          cat "$RUNNER_TEMP/b31-due-a.log" "$RUNNER_TEMP/b31-due-b.log"
          test "$rc_a" -eq 0 -a "$rc_b" -eq 0 || { echo 'Due-work concurrent workers failed' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<SQL
          do \$\$
          begin
            if not exists(select 1 from public.orders where id='$settle_order'::uuid and lifecycle_status='completed' and payout_status='eligible') then raise exception 'Due-work did not complete mature order'; end if;
            if (select count(*) from public.transaction_events where order_id='$settle_order'::uuid and event_type='order_completed')<>1 then raise exception 'Due-work duplicate completion event'; end if;
          end \$\$;
          SQL
          echo 'PASS B31 Due-work independent workers'

          # Transfer operation identity is durable and unique before any
          # provider request. Duplicate operation identity must be rejected.
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<SQL
          do \$\$
          declare a uuid; op uuid := '00000000-0000-0000-0000-00000000b311'; begin
            select id into a from marketplace_private.campus_payment_attempts where order_id='$settle_order'::uuid and status='paid';
            insert into marketplace_private.order_transfer_operations(
              order_id,payment_attempt_id,seller_id,transfer_kind,authority_kind,authority_at,
              provider,provider_mode,provider_platform,payment_intent_ref,destination_account_ref,
              amount_cents,currency,transfer_group,operation_id,idempotency_key)
            values('$settle_order'::uuid,a,'$settle_seller'::uuid,'sale_proceeds','protection_completed',clock_timestamp(),
              'stripe','test','acct_b31platform','pi_b31payment','acct_b31seller',1,'CAD',
              'uu_order_$settle_order',op,'uu:test:acct_b31platform:transfer:'||op::text);
            begin
              insert into marketplace_private.order_transfer_operations(
                order_id,payment_attempt_id,seller_id,transfer_kind,authority_kind,authority_at,
                provider,provider_mode,provider_platform,payment_intent_ref,destination_account_ref,
                amount_cents,currency,transfer_group,operation_id,idempotency_key)
              values('$settle_order'::uuid,a,'$settle_seller'::uuid,'sale_proceeds','protection_completed',clock_timestamp(),
                'stripe','test','acct_b31platform','pi_b31payment','acct_b31seller',1,'CAD',
                'uu_order_$settle_order',op,'uu:test:acct_b31platform:transfer:'||op::text);
              raise exception 'duplicate transfer operation unexpectedly accepted';
            exception when unique_violation then null;
            end;
          end \$\$;
          SQL
          echo 'PASS B31 Transfer operation identity uniqueness'

          # A prepared refund operation blocks release; a protection case
          # remains an independent hold even when the provider is not called.
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<SQL
          do \$\$
          begin
            if not exists(select 1 from marketplace_private.order_refund_operations where order_id='$refund_order'::uuid and state='prepared') then raise exception 'prepared refund fixture missing'; end if;
            perform marketplace_private.settle_order_protection('$refund_listing'::uuid);
            if exists(select 1 from public.orders where id='$refund_order'::uuid and lifecycle_status='completed') then raise exception 'prepared refund did not block release'; end if;
          end \$\$;
          SQL
          echo 'PASS B31 Refund Pending release gate'

          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<SQL
          do \$\$
          begin
            perform set_config('request.jwt.claims',jsonb_build_object('sub','$case_buyer','role','authenticated')::text,true);
            perform public.marketplace_open_protection_case('$case_order'::uuid,'WRONG_ITEM',gen_random_uuid());
            perform set_config('request.jwt.claims','{"role":"service_role","ref":"pcaqxezdfxofysghssyo"}',true);
            perform marketplace_private.settle_order_protection('$case_listing'::uuid);
            if exists(select 1 from public.orders where id='$case_order'::uuid and lifecycle_status='completed') then raise exception 'protection case did not block release'; end if;
          end \$\$;
          SQL
          echo 'PASS B31 Protection Case release gate'

          race_blocked_release() {
            local tag="$1" order="$2" listing="$3"
            cat > "$RUNNER_TEMP/${tag}-a.sql" <<SQL
          begin; set local application_name='${tag}_a';
          set local request.jwt.claims='{"role":"service_role","ref":"pcaqxezdfxofysghssyo"}';
          select marketplace_private.settle_order_protection('$order'::uuid);
          commit;
          SQL
            cat > "$RUNNER_TEMP/${tag}-b.sql" <<SQL
          begin; set local application_name='${tag}_b';
          set local request.jwt.claims='{"role":"service_role","ref":"pcaqxezdfxofysghssyo"}';
          select marketplace_private.settle_order_protection('$listing'::uuid);
          commit;
          SQL
            set +e
            docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/${tag}-a.sql" > "$RUNNER_TEMP/${tag}-a.log" 2>&1 & local a=$!
            docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/${tag}-b.sql" > "$RUNNER_TEMP/${tag}-b.log" 2>&1 & local b=$!
            wait "$a"; local ra=$?; wait "$b"; local rb=$?; set -e
            cat "$RUNNER_TEMP/${tag}-a.log" "$RUNNER_TEMP/${tag}-b.log"
            test "$ra" -eq 0 -a "$rb" -eq 0
            docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "select case when lifecycle_status='open' then 'PASS $tag blocked' else 'FAIL $tag released' end from public.orders where id='$order'::uuid;"
          }
          race_blocked_release b31_refund_race "$refund_order" "$refund_listing"
          race_blocked_release b31_case_race "$case_order" "$case_listing"

          cat > "$RUNNER_TEMP/b31-settle-a.sql" <<SQL
          begin;
          set local application_name='b31_settle_a';
          set local request.jwt.claims='{"role":"service_role","ref":"pcaqxezdfxofysghssyo"}';
          select 1 from public.listings where id='$settle_listing'::uuid for update;
          select pg_sleep(2);
          select marketplace_private.settle_order_protection('$settle_listing'::uuid);
          commit;
          SQL
          cat > "$RUNNER_TEMP/b31-settle-b.sql" <<SQL
          begin;
          set local application_name='b31_settle_b';
          set local request.jwt.claims='{"role":"service_role","ref":"pcaqxezdfxofysghssyo"}';
          select marketplace_private.settle_order_protection('$settle_listing'::uuid);
          commit;
          SQL
          set +e
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/b31-settle-a.sql" > "$RUNNER_TEMP/b31-settle-a.log" 2>&1 & pid_a=$!
          sleep 0.3
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$RUNNER_TEMP/b31-settle-b.sql" > "$RUNNER_TEMP/b31-settle-b.log" 2>&1 & pid_b=$!
          wait "$pid_a"; rc_a=$?
          wait "$pid_b"; rc_b=$?
          set -e
          cat "$RUNNER_TEMP/b31-settle-a.log" "$RUNNER_TEMP/b31-settle-b.log"
          test "$rc_a" -eq 0 -a "$rc_b" -eq 0 || { echo 'Protection settlement concurrent sessions failed' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<SQL
          do \$\$
          begin
            if not exists(select 1 from public.orders where id='$settle_order'::uuid and lifecycle_status='completed' and payout_status='eligible') then raise exception 'Settlement did not complete'; end if;
            if (select count(*) from public.transaction_events where order_id='$settle_order'::uuid and event_type='order_completed')<>1 then raise exception 'Duplicate settlement event'; end if;
          end \$\$;
          drop table public.b31_concurrency_fixture;
          SQL
          echo 'PASS B31 Protection Settlement independent-session idempotency'
      - name: Verify filtered notification definition and privileges
        if: steps.start-full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Multi-statement assertions require one session for transaction and SET ROLE.
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/sql/notification-filtered-assertions.sql
      - name: Run 008/009 authenticated and cross-account SQL assertions
        if: steps.start-full.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Multi-statement assertions require one session for transaction and SET ROLE.
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)"
          test -n "$db_container" || { echo 'Disposable local Postgres container not found' >&2; exit 1; }
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/sql/permissions-008-009-assertions.sql
      - name: Run static migration omission regression
        if: steps.start-full.outcome == 'success'
        run: node tests/notification-filtered-permission.cjs
      - name: Run verified-account 008 static manifest regression
        if: steps.start-full.outcome == 'success'
        run: node tests/verified-account-008-static.cjs

      - name: Diagnose failed database startup
        if: failure() && (steps.start-baseline.outcome == 'failure' || steps.start-full.outcome == 'failure')
        shell: bash
        run: |
          set +e
          {
            echo '=== docker containers ==='
            docker ps -a --no-trunc --filter name=supabase
            for id in $(docker ps -aq --filter name=supabase); do
              docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$id"
              docker logs --tail 80 "$id" 2>&1 | sed -E 's/((PASSWORD|TOKEN|SECRET|API[_-]?KEY|JWT|SERVICE_ROLE)[=:][^[:space:]]+)/\2=[REDACTED]/Ig'
            done
          } | tee "$RUNNER_TEMP/supabase-start-diagnostics.log"

      - name: Upload database diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-qualification-diagnostics
          path: |
            ${{ runner.temp }}/pre-008-migrations.txt
            ${{ runner.temp }}/b31-migrations.txt
            ${{ runner.temp }}/pre-008-start.log
            ${{ runner.temp }}/verified-account-008-baseline.txt
            ${{ runner.temp }}/supabase-start-diagnostics.log
            supabase-start.log
          retention-days: 1

      - name: Stop and destroy the full database
        if: always() && env.FULL_DIR != ''
        working-directory: ${{ env.FULL_DIR }}
        run: supabase stop --no-backup || true
